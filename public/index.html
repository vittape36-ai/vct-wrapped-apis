<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VCT Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-4xl mx-auto py-12 px-4">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">VCT Wrapped APIs Admin</h1>
    
    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-semibold mb-4">Provision New API Key</h2>
      <div class="flex gap-4">
        <input type="text" id="newKey" placeholder="vct_live_..." class="border p-2 rounded flex-1">
        <select id="plan" class="border p-2 rounded">
          <option value="free">Free</option>
          <option value="premium">Premium</option>
        </select>
        <button onclick="createKey()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Provision Key</button>
      </div>
      <p id="msg" class="text-sm mt-4 text-green-600 hidden"></p>
    </div>
  </div>

  <script>
    async function createKey() {
      const key = document.getElementById('newKey').value;
      const plan = document.getElementById('plan').value;
      if (!key) return alert('Enter a key');

      const res = await fetch('/admin/api/v1/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, plan })
      });
      
      const data = await res.json();
      const msg = document.getElementById('msg');
      msg.textContent = res.ok ? 'Key provisioned successfully in Redis!' : 'Failed: ' + data.error?.message;
      msg.classList.remove('hidden');
    }
  </script>
</body>
</html>
